# The tables of this repository, declared as data: the authority on what data/ may hold, checked by
# tad (creation-guidelines/tad-engine) on every change. First generated on 2026-11-11 from the schema it replaced.
[tables.concept_sources]
key = ["concept_id", "source_id"]

[[tables.concept_sources.fields]]
name = "concept_id"
type = "string"
required = true

[[tables.concept_sources.fields]]
name = "source_id"
type = "string"
required = true

[tables.concepts]
key = ["id"]

[[tables.concepts.fields]]
name = "id"
type = "string"
required = true
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

[[tables.concepts.fields]]
name = "name"
type = "string"
required = true

[[tables.concepts.fields]]
name = "summary"
type = "string"
required = true

[[tables.concepts.fields]]
name = "tags"
type = "list"
required = true

[tables.relations]
key = ["from_id", "to_id", "relation"]
distinct = [["from_id", "to_id"]]

[[tables.relations.fields]]
name = "from_id"
type = "string"
required = true

[[tables.relations.fields]]
name = "to_id"
type = "string"
required = true

[[tables.relations.fields]]
name = "relation"
type = "string"
required = true

[[tables.relations.fields]]
name = "note"
type = "string"

# Rules across tables (written by hand from the SQL checks they replaced; proven to give the same verdicts)
[[rules.unique_ids]]
tables = ["concepts", "backlog", "session_log"]

[[rules.references]]
field = "relations.from_id"
to = ["concepts", "backlog", "session_log"]

[[rules.references]]
field = "relations.to_id"
to = ["concepts", "backlog", "session_log"]

[[rules.appears_in]]
table = "concepts"
in = "concept_sources.concept_id"

# idealkb:begin - the standing tables of a knowledge base, kept by grenudi/ideal-knowledge-base at the
# release idealkb.toml names (change them there). Every record names what it is about in about; the base
# says what about may name in its own [[rules.references]] (field = "TABLE.about", to = its subject tables).
[tables.backlog]
key = ["id"]

[[tables.backlog.fields]]
name = "id"
type = "string"
required = true
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

[[tables.backlog.fields]]
name = "title"
type = "string"
required = true

[[tables.backlog.fields]]
name = "status"
type = "string"
required = true
enum = ["open", "in-progress", "done"]

[[tables.backlog.fields]]
name = "note"
type = "string"

[[tables.backlog.fields]]
name = "waits"
type = "string"
pattern = "^(?s).+$"

# what the item waits on that is another item of this base: ids, comma-separated. It is clear when each is done - read off the data. waits stays for what is outside (the author, hardware).
[[tables.backlog.fields]]
name = "blocked_by"
type = "string"
pattern = "^[a-z0-9]+(-[a-z0-9]+)*(, ?[a-z0-9]+(-[a-z0-9]+)*)*$"

# the hardware (ids of this base's hardware table) the item cannot be done without: it waits until each is owned and none refuted
[[tables.backlog.fields]]
name = "hardware"
type = "string"
pattern = "^[a-z0-9]+(-[a-z0-9]+)*(, ?[a-z0-9]+(-[a-z0-9]+)*)*$"

[[tables.backlog.fields]]
name = "about"
type = "string"

[[tables.backlog.fields]]
name = "opened"
type = "date"
required = true

# the queue a session takes from (tad q ready --for): what the item needs - the phone's keeper, a research lane, a build lane -, the test whose pass proves it done, and the author's order
[[tables.backlog.fields]]
name = "needs"
type = "string"
enum = ["phone", "research", "build"]

[[tables.backlog.fields]]
name = "proof"
type = "string"

[[tables.backlog.fields]]
name = "rank"
type = "integer"

[tables.session_log]
key = ["id"]

[[tables.session_log.fields]]
name = "id"
type = "string"
required = true
pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*$"

[[tables.session_log.fields]]
name = "entry_date"
type = "date"
required = true

[[tables.session_log.fields]]
name = "title"
type = "string"
required = true

[[tables.session_log.fields]]
name = "done"
type = "string"
required = true

[[tables.session_log.fields]]
name = "considered"
type = "string"

[[tables.session_log.fields]]
name = "rejected"
type = "string"

[[tables.session_log.fields]]
name = "about"
type = "string"

[tables.decisions]
key = ["id"]

[[tables.decisions.fields]]
name = "id"
type = "string"
required = true
pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*$"

[[tables.decisions.fields]]
name = "date"
type = "date"
required = true

# its brief: the record in one line, at most 200 characters - what an answer shows unless the whole is asked
[[tables.decisions.fields]]
name = "brief"
type = "string"

[[tables.decisions.fields]]
name = "decision"
type = "string"
required = true

[[tables.decisions.fields]]
name = "why"
type = "string"
required = true

[[tables.decisions.fields]]
name = "rejected"
type = "string"

[[tables.decisions.fields]]
name = "about"
type = "string"

[[tables.decisions.fields]]
name = "research"
type = "string"

# What this decision replaces whole (the old stays, reachable by find and row, and leaves about and decided), and
# what it changes in part (the old stays in force). Read the other way - superseded by, amended by - from these.
[[tables.decisions.fields]]
name = "supersedes"
type = "string"

[[tables.decisions.fields]]
name = "amends"
type = "string"

# Who it binds or touches: the bases, roles, tools or people that must know - the informed of an ADR.
[[tables.decisions.fields]]
name = "scope"
type = "string"

# The backlog item that carries it out, as a tracking issue does an accepted RFC: what decided says of it is read from that item.
[[tables.decisions.fields]]
name = "tracked_by"
type = "string"

[tables.research]
key = ["id"]

[[tables.research.fields]]
name = "id"
type = "string"
required = true
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

[[tables.research.fields]]
name = "date"
type = "date"
required = true

# its brief: the record in one line, at most 200 characters - what an answer shows unless the whole is asked
[[tables.research.fields]]
name = "brief"
type = "string"

[[tables.research.fields]]
name = "question"
type = "string"
required = true

[[tables.research.fields]]
name = "found"
type = "string"
required = true

[[tables.research.fields]]
name = "sources"
type = "string"

[[tables.research.fields]]
name = "about"
type = "string"

# Where the research's own material is kept - its notes, excerpts, measurements - out of every reader's way:
# a dated folder, research/SUBJECT/YYYY-MM-DD/. The row says the finding; the folder is read only when needed.
[[tables.research.fields]]
name = "material"
type = "string"
pattern = "^research/[a-z0-9]+(-[a-z0-9]+)*/[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-z0-9]+)*/$"

# The research this one is a later version of: redone research is a new row that supersedes the old, which
# stays, reachable by find and row, but leaves about's answer.
[[tables.research.fields]]
name = "supersedes"
type = "string"

# How a subject stands, in short, on top of its records: one per subject, renewed in place when the records
# move on (the earlier versions are in git). Its records stay as they are: a summary condenses, it holds
# nothing of its own. condenses is filled by the record from the records about the subject when written.
[tables.summaries]
key = ["about"]

[[tables.summaries.fields]]
name = "about"
type = "string"
required = true

[[tables.summaries.fields]]
name = "date"
type = "date"
required = true

[[tables.summaries.fields]]
name = "says"
type = "string"
required = true
pattern = "^(?s).{1,1500}$"

[[tables.summaries.fields]]
name = "condenses"
type = "string"
required = true

[[rules.references]]
field = "research.supersedes"
to = ["research"]

[tables.sources]
key = ["id"]

[[tables.sources.fields]]
name = "id"
type = "string"
required = true
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

[[tables.sources.fields]]
name = "title"
type = "string"
required = true

[[tables.sources.fields]]
name = "url"
type = "string"
required = true
starts_with = "https://"

[[tables.sources.fields]]
name = "author"
type = "string"

[[tables.sources.fields]]
name = "year"
type = "integer"

[[tables.sources.fields]]
name = "by"
type = "string"

[[tables.sources.fields]]
name = "takes"
type = "string"

# Where knowledge can flow: any external resource - a project, a mailing list, a tracker, a wiki, a standard, a
# person or team, another knowledge base's instance. One row each; what is headed there is an upstream_items row.
# A fork of another upstream is a row of its own that names it (fork_of): where its patches are carried until
# the upstream takes them.
[tables.upstreams]
key = ["id"]

[[tables.upstreams.fields]]
name = "id"
type = "string"
required = true
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

[[tables.upstreams.fields]]
name = "kind"
type = "string"
required = true
enum = ["code-project", "list", "tracker", "wiki", "standard", "person-team", "kb-instance", "distro"]

[[tables.upstreams.fields]]
name = "name"
type = "string"
required = true

[[tables.upstreams.fields]]
name = "address"
type = "string"
required = true

[[tables.upstreams.fields]]
name = "how"
type = "string"
required = true

[[tables.upstreams.fields]]
name = "contacts"
type = "string"

[[tables.upstreams.fields]]
name = "notes"
type = "string"

[[tables.upstreams.fields]]
name = "fork_of"
type = "string"

# What was headed to an upstream: a patch, a piece of information, a correction, a question, a finding. It
# links back to the work here it comes from (from_work: a backlog item, decision or research id) and may be a
# row, a file in upstream/UPSTREAM/ID/ (file), or both. The state only moves forward; the person's word that
# a draft may go is a state (ready), never a flag an agent sets. A patch kept in a fork until the
# upstream has it names the fork (carried_in: the fork repository and branch) - carried is a place, not a state,
# so a patch is "sent" and "carried" at once; reviewed_by keeps the reviewers named in the replies (Reviewed-by,
# Acked-by, Tested-by).
[tables.upstream_items]
key = ["id"]

[[tables.upstream_items.fields]]
name = "id"
type = "string"
required = true
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

[[tables.upstream_items.fields]]
name = "upstream"
type = "string"
required = true

[[tables.upstream_items.fields]]
name = "title"
type = "string"
required = true

[[tables.upstream_items.fields]]
name = "form"
type = "string"
required = true
enum = ["patch", "information", "correction", "question", "finding"]

[[tables.upstream_items.fields]]
name = "state"
type = "string"
required = true
enum = ["draft", "ready", "sent", "under-review", "changes-requested", "accepted", "landed", "held", "rejected", "superseded", "not-needed", "withdrawn"]

[[tables.upstream_items.fields]]
name = "from_work"
type = "string"
required = true

[[tables.upstream_items.fields]]
name = "domain"
type = "string"

[[tables.upstream_items.fields]]
name = "tags"
type = "string"

[[tables.upstream_items.fields]]
name = "about"
type = "string"

[[tables.upstream_items.fields]]
name = "local_ref"
type = "string"

[[tables.upstream_items.fields]]
name = "file"
type = "string"

[[tables.upstream_items.fields]]
name = "sent_on"
type = "date"

[[tables.upstream_items.fields]]
name = "forwarded"
type = "string"

[[tables.upstream_items.fields]]
name = "bug"
type = "string"

[[tables.upstream_items.fields]]
name = "version"
type = "string"

[[tables.upstream_items.fields]]
name = "supersedes"
type = "string"

[[tables.upstream_items.fields]]
name = "applied_upstream"
type = "string"

[[tables.upstream_items.fields]]
name = "carried_in"
type = "string"

[[tables.upstream_items.fields]]
name = "reviewed_by"
type = "string"

[[tables.upstream_items.fields]]
name = "waits"
type = "string"

[[tables.upstream_items.fields]]
name = "note"
type = "string"

[[tables.upstream_items.fields]]
name = "last_update"
type = "date"
required = true

[[rules.references]]
field = "upstream_items.upstream"
to = ["upstreams"]

[[rules.references]]
field = "upstreams.fork_of"
to = ["upstreams"]

[[rules.references]]
field = "upstream_items.supersedes"
to = ["upstream_items"]
[[rules.references]]
field = "decisions.supersedes"
to = ["decisions"]

[[rules.references]]
field = "decisions.amends"
to = ["decisions"]

[[rules.references]]
field = "decisions.tracked_by"
to = ["backlog"]

# The hardware the work needs beyond the machine: cables, adapters, breakouts, meters, and the setups made of
# them. One shape in docs (the general catalogue: status = general, what a thing is, its wiring, sources) and in each
# device base (what this lab has or wants for this phone, and whether it is CONFIRMED to work on it). Stock lives in
# the base of the lab that holds the thing; a device row that is an instance of a catalogue entry names it in
# `general`. A price carries the day it was quoted, a source the day it was read (checked_on): both go stale.
[tables.hardware]
key = ["id"]
requires = [["price", "price_on"], ["fit_ref", "fit"]]

[[tables.hardware.fields]]
name = "id"
type = "string"
required = true
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

[[tables.hardware.fields]]
name = "kind"
type = "string"
required = true
enum = ["cable", "adapter", "breakout", "meter", "tool", "part", "setup"]

[[tables.hardware.fields]]
name = "name"
type = "string"
required = true

[[tables.hardware.fields]]
name = "status"
type = "string"
required = true
enum = ["general", "wanted", "ordered", "owned", "lent", "broken", "retired"]

[[tables.hardware.fields]]
name = "fit"
type = "string"
enum = ["claimed", "confirmed", "refuted"]

[[tables.hardware.fields]]
name = "fit_ref"
type = "string"

[[tables.hardware.fields]]
name = "spec"
type = "string"

[[tables.hardware.fields]]
name = "wiring"
type = "string"

[[tables.hardware.fields]]
name = "serves"
type = "string"

[[tables.hardware.fields]]
name = "about"
type = "string"

[[tables.hardware.fields]]
name = "general"
type = "string"

[[tables.hardware.fields]]
name = "qty"
type = "integer"
minimum = 0

[[tables.hardware.fields]]
name = "price"
type = "string"

[[tables.hardware.fields]]
name = "price_on"
type = "date"

[[tables.hardware.fields]]
name = "sources"
type = "string"

[[tables.hardware.fields]]
name = "file"
type = "string"

[[tables.hardware.fields]]
name = "note"
type = "string"

[[tables.hardware.fields]]
name = "checked_on"
type = "date"
required = true

[[rules.references]]
field = "hardware.about"
to = ["backlog"]

# idealkb:end
